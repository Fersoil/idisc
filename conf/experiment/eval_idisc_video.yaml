# @package _global_
# Evaluate the released iDisc (resnet101 + AFP) on KITTI 4-frame sequences.
# The AFP baseline has no temporal path, so eval flattens each clip and scores
# frame-by-frame; coverage is the sequence manifest's test_frames (clip-based),
# not the full single-frame Eigen split, so numbers aren't 1:1 with eval_idisc_image.
defaults:
  - override /dataset: kitti
  - override /model: idisc_r101

run:
  exp_id: eval-idisc-video
  task: eval
  dataset_mode: video

method:
  idr_source: afp
  sam_mode: null
  prompt:
    mode: null
    classes: []

tags:
  - idisc
  - eval
  - video
