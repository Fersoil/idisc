# @package _global_
#
# Pure SAM3 + iDisc d2c, translator-IDR mode (E12):
#   - Same pure-SAM3 setup as E11 (frozen SAM3 backbone, fresh-init iDisc).
#   - sam_mode=translate uses the new Sam3QueryToIDR module instead of the
#     single-Linear sam3_proj. Learnable seed vectors cross-attend to all
#     200 SAM3 queries to distill them into 32 depth-flavored IDRs.
#   - Replaces AFP (no concat with AFP IDRs).

defaults:
  - override /dataset: kitti

run:
  exp_id: E12-online-sam3-translate
  task: finetune
  load_pretrained: false

dataset:
  legacy_config_path: configs/kitti/kitti_sam3_translate.json

method:
  idr_source: afp
  sam_mode: translate
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]
    use_bbox: false
    strategy: all

tags:
  - sam3-pure
  - translate
  - multiclass
  - sam3-frozen
  - idisc-scratch
