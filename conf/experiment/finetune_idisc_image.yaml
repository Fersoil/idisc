# @package _global_
# Finetune the released iDisc (resnet101 + AFP) on KITTI single-frame data.
defaults:
  - override /dataset: kitti
  - override /model: idisc_r101
  - override /finetune: image

run:
  exp_id: finetune-idisc-image
  task: train
  dataset_mode: image

method:
  idr_source: afp
  sam_mode: null
  prompt:
    mode: null
    classes: []

tags:
  - idisc
  - finetune
  - image
