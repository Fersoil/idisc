# @package _global_
#
# E15 — SAM3 Video encoder + iDisc d2c, translate mode (sequence dataset):
#   - Same video encoder as E14 (sam3_video, temporal tracker memory propagates
#     frame-0 detections to frames 1-3 within each 4-frame clip).
#   - Uses sam_mode=translate (Sam3QueryToIDR projection) instead of E14's
#     direct replace, to learn a stable mapping from noisy tracker queries.
#   - Legacy E19 tried video+translate but had a broken prompt loop (only
#     "building" applied) and used cached queries. This run uses online SAM3
#     inference with the correct multiclass single-prompt, matching E14.
#   - Needs 5060ti (16 GB) — same as E14.

defaults:
  - override /dataset: kitti

run:
  exp_id: E15-online-sam3-video-translate
  task: finetune
  load_pretrained: false

dataset:
  legacy_config_path: configs/kitti/kitti_sam3_video.json

method:
  idr_source: afp
  sam_mode: translate
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]
    use_bbox: false
    strategy: all

finetune:
  use_sequence_dataset: true
  batch_size: 1

tags:
  - sam3-video
  - translate
  - multiclass
  - sequence
  - sam3-frozen
  - idisc-scratch
