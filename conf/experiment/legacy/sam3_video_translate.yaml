# @package _global_
# E15 — SAM3 Video encoder + Sam3QueryToIDR translator (sequence dataset).
defaults:
  - override /dataset: kitti
  - override /model: idisc_sam3_video
  - override /finetune: video
  - _self_

run:
  exp_id: E15-online-sam3-video-translate
  dataset_mode: video

method:
  idr_source: sam3
  sam_mode: translate
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]

model:
  sam3_translate:
    depths: 2
    query_in_dim: 256

tags:
  - sam3-video
  - translate
  - multiclass
  - sequence
