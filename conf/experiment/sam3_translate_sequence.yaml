# @package _global_
#
# E17 — Pure SAM3 + iDisc d2c, translator-IDR mode + sequence dataset:
#   - Same architecture as E12 (sam_mode=translate, K=200 singleclass).
#   - Train data is `KITTISequenceDataset` (4-frame clips); the per-frame
#     loop in finetune_sam.py flattens (B, T, ...) → (B*T, ...) so the
#     existing d2c training pipeline handles it without changes.
#   - val_dataset stays the standard KITTIDataset for apples-to-apples
#     comparison against E11/E12 val abs_rel numbers.

defaults:
  - override /dataset: kitti

run:
  exp_id: E17-sam3-translate-sequence
  task: finetune
  load_pretrained: false

dataset:
  legacy_config_path: configs/kitti/kitti_sam3_translate_sequence.json

method:
  idr_source: afp
  sam_mode: translate
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]
    use_bbox: false
    strategy: all

finetune:
  use_sequence_dataset: true

tags:
  - sam3-pure
  - translate
  - multiclass
  - sequence
  - sam3-frozen
  - idisc-scratch
