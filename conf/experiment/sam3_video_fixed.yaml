# @package _global_
#
# E21 — SAM3 Video encoder + iDisc d2c, with FPN-capture fix:
#   - Same config as E14 (sam3_video_sequence) and E19. The only difference
#     is the code fix in idisc/models/sam3_video_encoder.py that repoints
#     the FPN-capture monkey-patch from backbone.forward_image (never called
#     by the SAM3 video pipeline) to vision_backbone.forward (called every
#     frame). E14 trained on identically-zero FPN tensors for all 40k batches.
#   - Expected: abs_rel converges into the 0.08–0.09 range, matching E13
#     (image-encoder, same dataset).

defaults:
  - override /dataset: kitti

run:
  exp_id: E21-online-sam3-video-fixed
  task: finetune
  load_pretrained: false

dataset:
  legacy_config_path: configs/kitti/kitti_sam3_video.json

method:
  idr_source: afp
  sam_mode: replace
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]
    use_bbox: false
    strategy: all

finetune:
  use_sequence_dataset: true

tags:
  - sam3-video
  - replace
  - multiclass
  - sequence
  - sam3-frozen
  - idisc-scratch
  - fpn-capture-fixed
