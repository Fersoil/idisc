# @package _global_
defaults:
  - override /dataset: kitti
  - override /model: idisc_sam3_image
  - override /finetune: image

run:
  exp_id: finetune-sam3-kitti-adapter-mem
  task: train
  dataset_mode: image

method:
  idr_source: sam3
  sam_mode: adapter
  prompt:
    mode: multiclass
    classes: [vehicle, tree, road, building]

model:
  pixel_encoder:
    pixel_source: sam3_memory
    sam3_trainable: [neck, encoder, decoder]

tags: [finetune, sam3, kitti, image]
