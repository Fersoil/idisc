# @package _global_
# iDisc-R101 on KITTI 4-frame clips with a frozen SAM3 tracker side-branch penalizing
# per-tracked-object depth jitter. weight=0 reproduces plain frame-wise video finetuning.
defaults:
  - override /dataset: kitti
  - override /model: idisc_r101
  - override /finetune: video

run:
  exp_id: finetune-idisc-video-temporal
  task: train
  dataset_mode: video

method:
  idr_source: afp
  sam_mode: null
  prompt:
    mode: null
    classes: []

finetune:
  temporal:
    enabled: true
    weight: 0.1

tags:
  - idisc
  - temporal
  - video
