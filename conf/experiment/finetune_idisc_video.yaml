# @package _global_
# Finetune the released iDisc (resnet101 + AFP) on KITTI 4-frame sequences.
defaults:
  - override /dataset: kitti
  - override /model: idisc_r101
  - override /finetune: video

run:
  exp_id: finetune-idisc-video
  task: train
  dataset_mode: video

method:
  idr_source: afp
  sam_mode: null
  prompt:
    mode: null
    classes: []

tags:
  - idisc
  - finetune
  - video
